name: 仓库保活

on:
  schedule:
    # 每周1运行一次，避免仓库因长期无活动被标记为"僵尸仓库"
    - cron: '51 12 * * 5'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          echo " 最后保活时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/KEEPALIVE.md
          echo " 触发方式: ${{ github.event_name }}" >> .github/KEEPALIVE.md

      - name: 提交并推送
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo " 无变更，跳过提交"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push
            echo " 保活提交成功"
          fi
